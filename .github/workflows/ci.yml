name: CI

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: write
  id-token: write

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: "24"
          registry-url: "https://registry.npmjs.org"
          package-manager-cache: false

      - name: Setup npm
        run: |
          npm install --global npm@11.6.2
          npm --version

      - name: Configure npm for OIDC
        run: |
          npmrc="${NPM_CONFIG_USERCONFIG:-$HOME/.npmrc}"

          echo "npm config file:"
          echo "$npmrc"

          if [ -f "$npmrc" ]; then
            sed -i '/_authToken/d' "$npmrc"
          fi

          npm config set registry https://registry.npmjs.org/

          echo "Final npm registry:"
          npm config get registry

          echo "Checking npm auth configuration:"
          if [ -f "$npmrc" ] && grep -q "_authToken" "$npmrc"; then
            echo "ERROR: _authToken still exists"
            exit 1
          fi

          echo "No _authToken configured. OIDC will be used for publish."

      - name: Verify Node and npm
        run: |
          echo "Node:"
          node --version

          echo "npm:"
          npm --version

          echo "Registry:"
          npm config get registry

          echo "GitHub OIDC:"
          if [ -n "${ACTIONS_ID_TOKEN_REQUEST_URL:-}" ]; then
            echo "ACTIONS_ID_TOKEN_REQUEST_URL: SET"
          else
            echo "ACTIONS_ID_TOKEN_REQUEST_URL: NOT SET"
            exit 1
          fi

          if [ -n "${ACTIONS_ID_TOKEN_REQUEST_TOKEN:-}" ]; then
            echo "ACTIONS_ID_TOKEN_REQUEST_TOKEN: SET"
          else
            echo "ACTIONS_ID_TOKEN_REQUEST_TOKEN: NOT SET"
            exit 1
          fi

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test

      - name: Validate npm package
        run: npm pack --dry-run

      - name: Create GitHub App token
        id: app-token
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ secrets.APP_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}
          owner: arcadia-man

      - name: Verify GitHub App token
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          if [ -z "$GH_TOKEN" ]; then
            echo "GitHub App token was not created"
            exit 1
          fi

          echo "GitHub App token exists: YES"

          curl \
            --silent \
            --show-error \
            --fail \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            https://api.github.com/installation/repositories > /dev/null

          echo "GitHub App token is valid."

      - name: Release
        if: >
          github.ref == 'refs/heads/main' &&
          github.event_name == 'push' &&
          !startsWith(github.event.head_commit.message, 'gitbot:')
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: .github/workflows/release.sh