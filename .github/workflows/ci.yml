
name: CI

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: write
  id-token: write

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: "24"
          package-manager-cache: false

      - name: Setup npm
        run: |
          npm install --global npm@11.9.0
          echo "Node: $(node --version)"
          echo "npm: $(npm --version)"

      - name: Configure npm registry
        run: |
          npm config set registry https://registry.npmjs.org/
          echo "Registry: $(npm config get registry)"

      - name: Verify npm OIDC environment
        run: |
          if [ -n "${NODE_AUTH_TOKEN:-}" ]; then
            echo "ERROR: NODE_AUTH_TOKEN must not be set"
            exit 1
          fi

          if [ -z "${ACTIONS_ID_TOKEN_REQUEST_URL:-}" ]; then
            echo "ERROR: OIDC request URL missing"
            exit 1
          fi

          if [ -z "${ACTIONS_ID_TOKEN_REQUEST_TOKEN:-}" ]; then
            echo "ERROR: OIDC request token missing"
            exit 1
          fi

          echo "OIDC environment is available"

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test

      - name: Validate npm package
        run: npm pack --dry-run

      - name: Create GitHub App token
        id: app-token
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ secrets.APP_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}
          owner: arcadia-man

      - name: Verify GitHub App token
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          if [ -z "$GH_TOKEN" ]; then
            echo "GitHub App token was not created"
            exit 1
          fi

          curl \
            --silent \
            --show-error \
            --fail \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            https://api.github.com/installation/repositories > /dev/null

          echo "GitHub App token is valid"

      - name: Release
        if: >
          github.ref == 'refs/heads/main' &&
          github.event_name == 'push' &&
          !startsWith(github.event.head_commit.message, 'gitbot:')
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: .github/workflows/release.sh
