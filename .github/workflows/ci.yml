name: CI

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: write
  id-token: write

jobs:
  test:
    runs-on: ubuntu-latest

    env:
      # Trusted Publishing uses GitHub OIDC.
      # Do not use an npm token for publishing.
      NODE_AUTH_TOKEN: ""

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: "24"
          package-manager-cache: false

      - name: Setup npm
        run: |
          npm install --global npm@11.9.0
          echo "Node:"
          node --version
          echo "npm:"
          npm --version

      - name: Configure npm registry
        run: |
          npm config set registry https://registry.npmjs.org/

          echo "Registry:"
          npm config get registry

      - name: Verify npm OIDC environment
        run: |
          echo "========================================"
          echo "npm OIDC verification"
          echo "========================================"

          echo "NODE_AUTH_TOKEN:"
          if [ -n "${NODE_AUTH_TOKEN:-}" ]; then
            echo "ERROR: NODE_AUTH_TOKEN is set"
            exit 1
          else
            echo "NOT SET"
          fi

          echo "ACTIONS_ID_TOKEN_REQUEST_URL:"
          if [ -n "${ACTIONS_ID_TOKEN_REQUEST_URL:-}" ]; then
            echo "SET"
          else
            echo "NOT SET"
            exit 1
          fi

          echo "ACTIONS_ID_TOKEN_REQUEST_TOKEN:"
          if [ -n "${ACTIONS_ID_TOKEN_REQUEST_TOKEN:-}" ]; then
            echo "SET"
          else
            echo "NOT SET"
            exit 1
          fi

          echo "npm registry:"
          npm config get registry

          echo "========================================"
          echo "OIDC environment looks correct"
          echo "========================================"

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test

      - name: Validate npm package
        run: npm pack --dry-run

      - name: Create GitHub App token
        id: app-token
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ secrets.APP_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}
          owner: arcadia-man

      - name: Verify GitHub App token
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          if [ -z "$GH_TOKEN" ]; then
            echo "GitHub App token was not created"
            exit 1
          fi

          echo "GitHub App token exists: YES"

          curl \
            --silent \
            --show-error \
            --fail \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            https://api.github.com/installation/repositories > /dev/null

          echo "GitHub App token is valid."

      - name: Release
        if: >
          github.ref == 'refs/heads/main' &&
          github.event_name == 'push' &&
          !startsWith(github.event.head_commit.message, 'gitbot:')
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          NODE_AUTH_TOKEN: ""
        run: .github/workflows/release.sh