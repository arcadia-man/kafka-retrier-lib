name: CI

on:
  push:
    branches:
      - main
  pull_request:

concurrency:
  group: kafka-retrier-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  test:
    name: Test and Validate
    runs-on: ubuntu-latest

    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: "24"
          package-manager-cache: false

      - name: Setup npm
        run: |
          npm install --global npm@11.9.0
          echo "Node: $(node --version)"
          echo "npm: $(npm --version)"

      - name: Configure npm registry
        run: |
          npm config set registry https://registry.npmjs.org/

      - name: Install dependencies
        run: npm ci

      - name: Run linter
        run: npm run lint

      - name: Run tests
        run: npm test

      - name: Validate npm package
        run: npm pack --dry-run

  release:
    name: Publish and Release
    # -------------------------------------------------------------------------
    # COMMIT MESSAGE RULES & AUTOMATED RELEASES:
    # Releases trigger automatically on push to 'main' based on Conventional Commit format:
    #   - Patch release (1.0.1 -> 1.0.2): fix: ... or fix(scope): ...
    #   - Minor release (1.0.1 -> 1.1.0): feat: ... or feat(scope): ...
    #   - Major release (1.0.1 -> 2.0.0): feat!: ... or <type>!: ... or "BREAKING CHANGE:"
    #   - No release created: docs: ..., chore: ..., test: ..., refactor: ..., style: ..., ci: ...
    #   - Commits starting with "gitbot:" are skipped to avoid recursive releases.
    # -------------------------------------------------------------------------
    runs-on: ubuntu-latest
    needs: test

    if: >
      github.event_name == 'push' &&
      github.ref == 'refs/heads/main' &&
      !startsWith(github.event.head_commit.message, 'gitbot:')

    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: "24"
          package-manager-cache: false

      - name: Setup npm
        run: |
          npm install --global npm@11.9.0
          echo "Node: $(node --version)"
          echo "npm: $(npm --version)"

      - name: Configure npm registry
        run: |
          npm config set registry https://registry.npmjs.org/
          echo "Registry: $(npm config get registry)"

      - name: Create GitHub App token
        id: app-token
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ secrets.APP_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}
          owner: arcadia-man

      - name: Verify GitHub App token
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          if [ -z "$GH_TOKEN" ]; then
            echo "ERROR: GitHub App token was not created"
            exit 1
          fi

          curl --silent --show-error --fail \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            https://api.github.com/installation/repositories \
            > /dev/null

          echo "GitHub App token verified"

      - name: Publish and create GitHub release
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: bash .github/workflows/release.sh