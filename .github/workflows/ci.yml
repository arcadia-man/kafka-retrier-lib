name: CI

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: write
  id-token: write

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Debug Git after checkout
        run: |
          echo "========================================"
          echo "Git checkout debug"
          echo "========================================"

          echo "Branch:"
          git branch --show-current

          echo "Commit:"
          git rev-parse HEAD

          echo "Remote:"
          git remote -v

          echo "Git credential helper:"
          git config --show-origin --get-all credential.helper || true

          echo "Git URL rewrite:"
          git config --show-origin --get-regexp '^url\.' || true

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org

      - name: Debug Node and npm
        run: |
          echo "========================================"
          echo "Node/npm debug"
          echo "========================================"

          node --version
          npm --version
          npm config get registry

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test

      - name: Validate npm package
        run: npm pack --dry-run

      - name: Create GitHub App token
        id: app-token
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ secrets.APP_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}
          owner: arcadia-man

      - name: Debug GitHub App token
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          echo "========================================"
          echo "GitHub App authentication debug"
          echo "========================================"

          if [ -n "$GH_TOKEN" ]; then
            echo "GH_TOKEN exists: YES"
          else
            echo "GH_TOKEN exists: NO"
            exit 1
          fi

          echo "GH_TOKEN length:"
          echo "${#GH_TOKEN}"

          echo "Testing GitHub API with App token..."

          curl \
            --silent \
            --show-error \
            --fail \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            https://api.github.com/installation/repositories

          echo
          echo "GitHub App token is valid."

      - name: Release
        if: >
          github.ref == 'refs/heads/main' &&
          github.event_name == 'push' &&
          !startsWith(github.event.head_commit.message, 'gitbot:')
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: .github/workflows/release.sh